# =============================================================================
# paths.yaml — caminhos de dados, modelos e saídas (relativos à raiz do projeto).
# Resolvidos para pathlib.Path em src/config/paths.py.
# =============================================================================

data:
  # Arquitetura medalhão. A camada bronze nunca é modificada.
  bronze: data/bronze   # como recebido (imutável) + manifest.json
  silver: data/silver   # limpo, tipado e validado (contrato bruto)
  gold: data/gold       # features prontas para modelagem + manifest.json

models: models

reports:
  root: reports
  figures: reports/figures
  metrics: reports/metrics
  model_cards: reports/model_cards
  datasheets: reports/datasheets

logs: logs
